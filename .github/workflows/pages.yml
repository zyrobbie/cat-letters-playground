name: Verify and publish playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cat-playground-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate public files and JavaScript
        run: python3 scripts/prepare-site.py
      - name: Run deterministic game tests
        run: python3 scripts/run-tests.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Check deployed revision and every asset
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/verify-live.py
      - name: Retain live integrity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integrity
          path: live-integrity.json
          if-no-files-found: ignore
