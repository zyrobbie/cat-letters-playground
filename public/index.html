<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><meta name="description" content="有猫来信的独立轻互动试片。在熟悉的家里，陪狸花猫玩一会儿纸箱滚球。"><title>纸箱滚球 · 有猫来信</title><link rel="icon" href="./assets/ball.webp"><link rel="stylesheet" href="./styles.css"></head>
<body><div class="shell"><header><span class="brand">有猫来信</span><span class="edition">轻互动试片</span></header><main>
<section id="homeView"><div class="section-heading"><h1>小猫在家</h1><span id="homeState">晒着太阳</span></div><div class="home-scene" aria-label="熟悉的家"><img class="room" src="./assets/home.webp" alt="黄色花被、木桌绿植、白窗帘和花纹地毯，熟悉的小猫的家"><img id="homeCat" class="home-cat" src="./assets/cat-play.webp" alt="狸花猫在地毯旁抬起前爪"><div id="homeImageError" class="image-error" hidden>家的画面暂时没能加载。<button id="homeReloadButton">重新加载</button></div></div><div class="home-copy"><h2 id="homeLine">球在地毯边，刚好有一点空闲。</h2><p id="homeNote">不用做什么准备，想玩就玩一会儿。</p></div><button id="startButton" class="primary wide">玩一会儿</button><p class="quiet-note">没有积分，也不用完成什么。</p></section>
<section id="gameView" hidden><div class="game-heading"><button id="backButton" class="text-button" aria-label="离开小游戏，回到家"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>回家</button><h1 id="gameTitle" tabindex="-1">纸箱滚球</h1><span class="heading-spacer"></span></div><p id="stageDescription" class="instruction">拖动纸板，轻点转向，再把球轻轻推出去。</p>
<div id="stage" class="stage"><svg id="scene" viewBox="0 0 1000 800" role="group" aria-label="纸箱滚球互动区域"><defs><clipPath id="sceneClip"><rect width="1000" height="800" rx="24"/></clipPath><clipPath id="pawClip"><path d="M497 319 Q544 300 585 319 Q636 335 631 366 Q632 394 607 384 L583 372 Q550 383 518 364 Z"/></clipPath><mask id="bodyMask" maskUnits="userSpaceOnUse" x="0" y="0" width="768" height="512"><rect width="768" height="512" fill="white"/><path d="M497 319 Q544 300 585 319 Q636 335 631 366 Q632 394 607 384 L583 372 Q550 383 518 364 Z" fill="black"/></mask></defs><g clip-path="url(#sceneClip)"><image id="gameRoom" href="./assets/room-clean.webp" x="-650" y="-400" width="1800" height="1200" preserveAspectRatio="none"/><g id="entities"><g id="catEntity"><g id="catShadow"><ellipse cx="850" cy="480" rx="64" ry="13" fill="#866044" opacity=".12"/></g><g id="catRoot"><image id="gameCat" href="./assets/cat-play.webp" width="768" height="512" mask="url(#bodyMask)"/><g id="catPaw" clip-path="url(#pawClip)"><image href="./assets/cat-play.webp" width="768" height="512"/></g></g></g><image id="boxBack" href="./assets/box-solid.webp" x="555" y="400" width="150" height="125"/><g id="boards"></g><g id="ballGroup"><ellipse id="ballShadow" cx="120" cy="710" rx="22" ry="7" fill="#765234" opacity=".16"/><image id="ball" href="./assets/ball.webp" x="102" y="682" width="36" height="36"/></g></g><g id="responseMarks" opacity="0" aria-hidden="true"><path d="M0 0 0-14 M13 4 21-7 M-13 4-21-7" fill="none" stroke="#a6532f" stroke-width="4" stroke-linecap="round"/></g></g></svg><div id="imageError" class="image-error" hidden>画面没有完整加载。<button id="reloadButton">重新加载</button></div></div>
<div class="below-scene"><p id="status" class="status" role="status" aria-live="polite">拖动纸板，或轻点一下让它转向。</p><div id="playControls"><div class="action-row"><button id="pushButton" class="primary">轻推一下</button><button id="resetButton" class="secondary">把球拿回来</button></div><div class="board-controls"><label for="boardSelect">调整</label><select id="boardSelect" aria-label="选择要调整的纸板"></select><button id="rotateLeft" aria-label="选中纸板逆时针旋转">左转</button><button id="rotateRight" aria-label="选中纸板顺时针旋转">右转</button></div><details id="adjustDetails"><summary>不用拖动也可以调整</summary><div class="nudge-controls"><button data-nudge="-20,0" aria-label="选中纸板向左移动">向左</button><button data-nudge="20,0" aria-label="选中纸板向右移动">向右</button><button data-nudge="0,-20" aria-label="选中纸板向上移动">向上</button><button data-nudge="0,20" aria-label="选中纸板向下移动">向下</button></div><p>也可以选中画面中的纸板，用方向键移动，回车转向。</p></details><button id="helpButton" class="text-button helper">试试一个顺手的摆法</button></div><div id="betweenControls" hidden><button id="nextButton" class="primary wide">再换个摆法</button><button id="finishButton" class="text-button finish">就玩到这里</button></div><div id="endControls" hidden><button id="endHomeButton" class="primary wide">回家</button><button id="replayButton" class="text-button finish">还想再玩一会儿</button></div></div></section>
</main><footer><details id="testSettings"><summary>测试场景</summary><fieldset><legend>小猫现在在哪里？</legend><label><input type="radio" name="presence" value="home" checked> 在家</label><label><input type="radio" name="presence" value="away"> 旅行中</label></fieldset><p>仅切换这张试片的场景，不影响主产品。</p></details><p class="footer-note">独立试片 · 不连接主线账号或来信</p></footer></div><script type="module" src="./game.mjs"></script></body></html>
