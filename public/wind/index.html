<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><meta name="description" content="在有猫来信熟悉的家里，和狸花猫一起摆弄纸叶。独立轻互动试片。"><title>窗边一阵风 · 有猫来信</title><link rel="icon" href="./assets/leaf-green.webp"><link rel="stylesheet" href="./styles.css"></head><body><div class="shell"><header><span class="brand">有猫来信</span><span class="edition">轻互动试片</span></header><main>
<section id="homeView"><div class="section-heading"><h1>小猫在家</h1><span id="homeState">窗边有一点风</span></div><div class="home-scene"><img class="room" src="./assets/home.webp" alt="熟悉的家：黄色花被、白窗帘和花纹地毯"><img id="homeCat" class="home-cat" src="./assets/cat-play.webp" alt="狸花猫抬起前爪"></div><div class="home-copy"><h2 id="homeLine">几片纸叶，落在窗边的阳光里。</h2><p>不用摆对什么，喜欢现在的样子就好。</p></div><button id="startButton" class="primary wide">玩一会儿</button><p class="quiet-note">没有积分，也不用收齐。</p></section>
<section id="gameView" hidden><div class="game-heading"><button id="backButton" class="text-button" aria-label="离开小游戏，回到家"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>回家</button><h1 id="gameTitle" tabindex="-1">窗边一阵风</h1><span class="heading-spacer"></span></div><p id="instruction" class="instruction">慢慢划过纸叶，风会顺着手指走。轻点也可以。</p>
<div class="stage"><svg id="scene" viewBox="0 0 1000 800" role="group" aria-label="窗边纸叶互动区域"><defs><clipPath id="sceneClip"><rect width="1000" height="800" rx="24"/></clipPath><clipPath id="pawClip"><path d="M497 319 Q544 300 585 319 Q636 335 631 366 Q632 394 607 384 L583 372 Q550 383 518 364 Z"/></clipPath><mask id="bodyMask" maskUnits="userSpaceOnUse" x="0" y="0" width="768" height="512"><rect width="768" height="512" fill="white"/><path d="M497 319 Q544 300 585 319 Q636 335 631 366 Q632 394 607 384 L583 372 Q550 383 518 364 Z" fill="black"/></mask></defs><g clip-path="url(#sceneClip)"><image href="./assets/room-clean.webp" x="-650" y="-400" width="1800" height="1200" preserveAspectRatio="none"/><image id="tray" href="./assets/tray.webp" x="285" y="600" width="310" height="116"/><g id="entities"><g id="catEntity"><ellipse cx="820" cy="547" rx="66" ry="13" fill="#866044" opacity=".12"/><g id="catRoot" transform="translate(940 375) scale(-.36 .36)"><image id="gameCat" href="./assets/cat-play.webp" width="768" height="512" mask="url(#bodyMask)"/></g></g></g><g id="pawOverlay" transform="translate(940 375) scale(-.36 .36)"><g id="catPaw" clip-path="url(#pawClip)"><image href="./assets/cat-play.webp" width="768" height="512"/></g></g><g id="breeze" aria-hidden="true" opacity="0"><path d="M-35 0Q0-12 35 0 M-20 14Q10 4 45 14" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round"/></g></g></svg><div id="imageError" class="image-error" hidden>画面没有完整加载。<button id="reloadButton">重新加载</button></div></div>
<div class="below-scene"><p id="status" class="status" role="status" aria-live="polite">从一片纸叶旁边，轻轻划一下。</p><div id="playControls"><div class="wind-controls" aria-label="不用滑动的吹风方式"><button id="leftWind">向左吹</button><button id="rightWind">向右吹</button><button id="swirlWind">打个小旋</button></div><p class="quiet-note">也可以选中纸叶，按回车轻推。</p><button id="finishButton" class="primary wide wind-finish">就留成这样</button><button id="newLeaves" class="text-button helper">换一组摆法</button></div><div id="endControls" hidden><button id="homeButton" class="primary wide">回家</button><button id="replayButton" class="text-button finish">还想再玩一会儿</button></div></div></section></main>
<footer><details><summary>测试场景</summary><fieldset><legend>小猫现在在哪里</legend><label><input type="radio" name="presence" value="home" checked>在家</label><label><input type="radio" name="presence" value="away">旅行中</label></fieldset><p>这是独立试片的场景切换，不会改变主产品。</p></details><p class="footer-note">独立试片 · 不连接主线账号或来信</p></footer></div><script type="module" src="./game.mjs"></script></body></html>
